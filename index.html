<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>自治会 回覧</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg: #e9ede6;        /* 回覧板の台紙のような淡い緑灰 */
      --paper: #ffffff;
      --ink: #1f2a3a;       /* 本文 */
      --sub: #5b6573;       /* 補足 */
      --accent: #2f6b4f;    /* 見出しの帯・リンク */
      --line: #cfd6cb;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; }
    html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px); scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 14px 48px; }

    header { padding: 8px 4px 20px; }
    header h1 { margin: 0; font-size: 1.6rem; line-height: 1.35; font-weight: 700; }
    header p { margin: 4px 0 0; color: var(--sub); font-size: 0.95rem; }

    nav {
      background: var(--paper);
      border-left: 6px solid var(--accent);
      padding: 14px 18px;
      margin-bottom: 28px;
    }
    nav h2 { margin: 0 0 6px; font-size: 1rem; color: var(--sub); font-weight: 600; }
    nav ol { margin: 0; padding-left: 1.4em; }
    nav li { padding: 3px 0; }
    nav a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

    section.doc {
      background: var(--paper);
      margin-bottom: 36px;
      padding: 16px 14px 6px;
      border-top: 4px solid var(--accent);
    }
    .doc-head {
      display: flex; flex-wrap: wrap; align-items: baseline;
      justify-content: space-between; gap: 6px 16px;
      margin-bottom: 14px;
    }
    .doc-head h2 { margin: 0; font-size: 1.2rem; line-height: 1.4; }
    .doc-head a { color: var(--accent); font-size: 0.95rem; white-space: nowrap; }

    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto !important;
      margin: 0 auto 14px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .status { text-align: center; color: var(--sub); font-size: 0.95rem; padding: 24px 0; }
    .error { color: #a3322a; }

    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="set-title">回覧</h1>
      <p id="set-date"></p>
    </header>
    <nav id="toc" hidden>
      <h2>今回の回覧物</h2>
      <ol id="toc-list"></ol>
    </nav>
    <main id="pdf-list">
      <p class="status" id="status">読み込んでいます…</p>
    </main>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ?set=20261004-0930 で回を指定。指定がなければ最新回を表示。
    const params = new URLSearchParams(location.search);
    const set = params.get('set');
    const manifestUrl = (set && /^[\w-]+$/.test(set))
      ? `pdf/${set}/list.json`
      : 'pdf/latest.json';

    // 高画質化の倍率（元のHTMLと同じ考え方。上げすぎるとスマホで重くなる）
    const RENDER_SCALE = Math.min(3, Math.max(2.5, window.devicePixelRatio || 2));

    const listEl = document.getElementById('pdf-list');
    const statusEl = document.getElementById('status');

    function el(tag, props = {}, text) {
      const e = document.createElement(tag);
      Object.assign(e, props);
      if (text != null) e.textContent = text;
      return e;
    }

    async function renderPdf(item, body) {
      const loading = el('p', { className: 'status' }, '表示しています…');
      body.appendChild(loading);
      try {
        const pdf = await pdfjsLib.getDocument(item.path).promise;
        loading.remove();
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const vp = page.getViewport({ scale: RENDER_SCALE });
          const canvas = el('canvas');
          canvas.width = Math.floor(vp.width);
          canvas.height = Math.floor(vp.height);
          canvas.setAttribute('role', 'img');
          canvas.setAttribute('aria-label', `${item.title} ${n}ページ目`);
          body.appendChild(canvas);
          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: vp,
            intent: 'print'
          }).promise;
          page.cleanup();
        }
      } catch (err) {
        console.error(err);
        loading.className = 'status error';
        loading.textContent = 'この資料を表示できませんでした。上の「PDFで開く」からご覧ください。';
      }
    }

    // 画面に近づいた資料から順に描画（スマホのメモリ負担を減らす）
    let queue = Promise.resolve();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        observer.unobserve(entry.target);
        const { item, body } = entry.target._job;
        queue = queue.then(() => renderPdf(item, body));
      });
    }, { rootMargin: '1200px 0px' });

    (async () => {
      let manifest;
      try {
        const res = await fetch(`${manifestUrl}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        manifest = await res.json();
      } catch (err) {
        console.error(err);
        statusEl.className = 'status error';
        statusEl.textContent = '回覧の一覧を読み込めませんでした。時間をおいて開き直してください。';
        return;
      }

      document.getElementById('set-title').textContent = manifest.title || '回覧';
      document.title = `${manifest.title || '回覧'}｜自治会`;
      if (manifest.createdAt) {
        const d = new Date(manifest.createdAt);
        document.getElementById('set-date').textContent =
          `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 掲載`;
      }
      statusEl.remove();

      const tocList = document.getElementById('toc-list');
      (manifest.items || []).forEach((item, i) => {
        const id = `doc-${i + 1}`;

        const li = el('li');
        li.appendChild(el('a', { href: `#${id}` }, item.title));
        tocList.appendChild(li);

        const section = el('section', { className: 'doc', id });
        const head = el('div', { className: 'doc-head' });
        head.appendChild(el('h2', {}, item.title));
        head.appendChild(el('a', { href: item.path, target: '_blank', rel: 'noopener' }, 'PDFで開く'));
        section.appendChild(head);

        const body = el('div');
        section.appendChild(body);
        listEl.appendChild(section);

        section._job = { item, body };
        observer.observe(section);
      });

      if ((manifest.items || []).length > 1) document.getElementById('toc').hidden = false;
    })();
  </script>
</body>
</html>
